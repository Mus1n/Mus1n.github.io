<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q3Elite Video</title>
  <style>
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    #player { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  </style>
</head>
<body>
  <iframe id="player" title="YouTube video player" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const video = (params.get("video") || "").replace(/[^A-Za-z0-9_-]/g, "");
      if (!video) return;
      const origin = encodeURIComponent(location.origin);
      const referrer = encodeURIComponent(location.href);
      document.getElementById("player").src =
        "https://www.youtube.com/embed/" + video +
        "?controls=1&autoplay=0&mute=1&playsinline=1&rel=0&fs=1" +
        "&origin=" + origin + "&widget_referrer=" + referrer;
    })();
  </script>
</body>
</html>
